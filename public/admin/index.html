<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Админ-панель — Локомотив</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<style>
  .admin-wrap { max-width: 800px; margin: 40px auto; padding: 0 20px; }
  .admin-card { background: var(--surface); border-radius: var(--radius); padding: 24px; margin-bottom: 20px; border: 1px solid var(--border); }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
  select { padding: 6px 10px; border-radius: 8px; border: 1px solid var(--border); }
  .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<div class="admin-wrap">
  <div id="loginBox" class="admin-card">
    <h2>Вход в админ-панель</h2>
    <div class="field"><label>Логин</label><input id="loginUsername" autocomplete="username"></div>
    <div class="field"><label>Пароль</label><input id="loginPassword" type="password" autocomplete="current-password"></div>
    <button class="btn btn-primary" id="loginBtn">Войти</button>
    <p class="form-msg error" id="loginError" hidden></p>
  </div>

  <div id="app" hidden>
    <div class="top-bar">
      <h1 style="margin:0;">Локомотив — админка</h1>
      <button class="btn" id="logoutBtn" style="background: var(--border);">Выйти</button>
    </div>

    <div class="admin-card">
      <h2>Заявки</h2>
      <table>
        <thead><tr><th>Дата</th><th>Имя</th><th>Телефон</th><th>Возраст</th><th>Статус</th></tr></thead>
        <tbody id="leadsBody"></tbody>
      </table>
    </div>

    <div class="admin-card">
      <h2>Смена пароля</h2>
      <div class="field"><label>Новый пароль (не короче 10 символов)</label><input id="newPassword" type="password"></div>
      <button class="btn btn-primary" id="changePasswordBtn">Сменить пароль</button>
      <p class="form-msg" id="passwordMsg" hidden></p>
    </div>
  </div>
</div>

<script src="/admin/admin.js"></script>
</body>
</html>
